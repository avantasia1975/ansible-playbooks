---
- hosts: local
  name: Create openstack server
  gather_facts: false
  roles:
    - role: openstack_network
      vars:
        openstack_network_dns_nameservers: "8.8.8.8"
    - role: openstack_security
      vars:
        openstack_security_group_tcp_ports: [22]
    - role: openstack_server
      vars:
        openstack_server_name: "ceph"
        openstack_server_ansible_group: "ceph"
        openstack_server_count: 3
        openstack_server_security_groups:
          - default
          - my-security-group
